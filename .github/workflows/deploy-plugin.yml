# Modes: pull request = test only; push or dispatch with plugin = environment, test, deploy,
# aggregate, then release on production tag pushes; dispatch with rebuild_only = aggregate only.
# For rebuild_only, --ref main targets staging and --ref plugin-<game>-v<ver> (an existing tag)
# targets production.
name: Deploy Plugin

on:
  push:
    branches: [main]
    tags: ["plugin-*-v*"]
    paths:
      - 'plugins/*/plugin.toml'
      - 'plugins/**/*.go'
      - 'plugins/**/*.rs'
      - 'plugins/**/Cargo.toml'
      - 'plugins/*/Justfile'
      - 'plugins/*/icon.*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'cmd/plugin-registry/**'
      - 'scripts/build-plugin-aggregate.sh'
      - '.github/workflows/deploy-plugin.yml'
  pull_request:
    paths:
      - 'plugins/*/plugin.toml'
      - 'plugins/**/*.go'
      - 'plugins/**/*.rs'
      - 'plugins/**/Cargo.toml'
      - 'plugins/*/Justfile'
      - 'plugins/*/icon.*'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'cmd/plugin-registry/**'
      - 'scripts/build-plugin-aggregate.sh'
      - '.github/workflows/deploy-plugin.yml'
  workflow_dispatch:
    inputs:
      plugin:
        description: "Plugin game_id to release (e.g. d2r)"
        required: false
        type: string
      rebuild_only:
        description: "Rebuild the aggregate from deployed descriptors only"
        required: false
        default: false
        type: boolean
      allow_remove:
        description: "Comma-separated deployed games allowed to be removed, or *"
        required: false
        default: ''
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write

env:
  GOEXPERIMENT: jsonv2

jobs:
  validate-dispatch:
    name: Validate dispatch inputs
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Require exactly one dispatch mode
        env:
          PLUGIN: ${{ inputs.plugin }}
          REBUILD_ONLY: ${{ inputs.rebuild_only }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if { [ -z "$PLUGIN" ] && [ "$REBUILD_ONLY" = "false" ]; } || \
             { [ -n "$PLUGIN" ] && [ "$REBUILD_ONLY" = "true" ]; }; then
            echo "ERROR: exactly one of plugin or rebuild_only must be provided"
            exit 1
          fi
          if [ -n "$PLUGIN" ] && [[ ! "$PLUGIN" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]; then
            echo "ERROR: plugin must match ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$"
            exit 1
          fi
          if [[ "$REF_NAME" == plugin-*-v* ]] && [ -n "$PLUGIN" ]; then
            tag_game_id="${REF_NAME#plugin-}"
            tag_game_id="${tag_game_id%-v*}"
            if [ "$PLUGIN" != "$tag_game_id" ]; then
              echo "ERROR: plugin input must match the tag game_id when dispatching at a plugin tag"
              exit 1
            fi
          fi

  environment:
    name: Detect environment
    permissions:
      contents: read
    needs: [validate-dispatch]
    if: always() && github.event_name != 'pull_request' && (needs.validate-dispatch.result == 'success' || needs.validate-dispatch.result == 'skipped')
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.version.outputs.environment }}
      is_production: ${{ steps.config.outputs.is_production }}
      r2_bucket: ${{ steps.config.outputs.r2_bucket }}
      server_url: ${{ steps.config.outputs.server_url }}
      version: ${{ steps.version.outputs.version }}
      game_id: ${{ steps.parse.outputs.game_id }}
      tag_prefix: ${{ steps.parse.outputs.tag_prefix }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Parse tag for game_id
        id: parse
        env:
          REF_NAME: ${{ github.ref_name }}
          MANUAL_PLUGIN: ${{ inputs.plugin }}
        run: |
          if [[ "$REF_NAME" == plugin-*-v* ]]; then
            temp="${REF_NAME#plugin-}"
            game_id="${temp%-v*}"
          else
            game_id="$MANUAL_PLUGIN"
          fi
          if [ -n "$game_id" ] && [[ ! "$game_id" =~ ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$ ]]; then
            echo "ERROR: game_id must match ^[a-z0-9]([a-z0-9-]{0,62}[a-z0-9])?$"
            exit 1
          fi
          if [ -n "$game_id" ]; then
            tag_prefix="plugin-${game_id}-v"
          else
            tag_prefix="plugin-v"
          fi
          {
            echo "game_id=${game_id}"
            echo "tag_prefix=${tag_prefix}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        uses: ./.github/actions/compute-version
        with:
          tag_prefix: ${{ steps.parse.outputs.tag_prefix }}

      - name: Set plugin configuration
        id: config
        env:
          DETECTED_ENV: ${{ steps.version.outputs.environment }}
        run: |
          if [ "$DETECTED_ENV" = "production" ]; then
            {
              echo "is_production=true"
              echo "r2_bucket=savecraft-plugins"
              echo "server_url=https://api.savecraft.gg"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "is_production=false"
              echo "r2_bucket=savecraft-plugins-staging"
              echo "server_url=https://staging-api.savecraft.gg"
            } >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Build plugins
    needs: [validate-dispatch]
    if: always() && (needs.validate-dispatch.result == 'success' || needs.validate-dispatch.result == 'skipped') && !(github.event_name == 'workflow_dispatch' && inputs.rebuild_only)
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.changed.outputs.plugins }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: taiki-e/install-action@a3324fb0eb94b8230ec968c3389c1b7929fc2f3b # v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable

      - name: Detect plugins to build
        id: changed
        env:
          MANUAL_PLUGIN: ${{ inputs.plugin }}
        run: |
          if [ -n "$MANUAL_PLUGIN" ]; then
            # workflow_dispatch: use provided plugin name
            changed="$MANUAL_PLUGIN"
          else
            # Check all plugins with a plugin.toml
            changed=""
            for dir in plugins/*/; do
              game_id=$(basename "$dir")
              [ -f "plugins/${game_id}/plugin.toml" ] || continue
              changed="${changed} ${game_id}"
            done
            changed=$(echo "$changed" | xargs)
          fi
          echo "plugins=${changed}" >> "$GITHUB_OUTPUT"
          if [ -z "$changed" ]; then
            echo "No plugins to check"
          else
            echo "Plugins to check: ${changed}"
          fi

      - name: Build plugins
        if: steps.changed.outputs.plugins != ''
        env:
          CHANGED_PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          for game_id in $CHANGED_PLUGINS; do
            echo "==> Building plugin: ${game_id}"
            just build-plugin "$game_id"
          done

      - name: Verify client-manifest.json is up to date
        if: steps.changed.outputs.plugins != ''
        env:
          CHANGED_PLUGINS: ${{ steps.changed.outputs.plugins }}
        run: |
          for game_id in $CHANGED_PLUGINS; do
            echo "==> Checking client manifest: ${game_id}"
            go run ./cmd/plugin-registry/ --version dev "plugins/${game_id}"
          done
          # Ignore sha256 lines — WASM binaries aren't reproducible across
          # environments (Rust/Go compiler, OS, linker). The deploy step
          # regenerates the manifest from freshly-built binaries anyway.
          if ! git diff --exit-code -I '"sha256":' plugins/*/client-manifest.json; then
            echo ""
            echo "ERROR: client-manifest.json is out of date (ignoring sha256). Run 'just plugin-registry <game> dev' and commit the result."
            exit 1
          fi

  deploy:
    name: Sign and upload
    needs: [environment, test]
    if: github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.rebuild_only) && needs.test.outputs.plugins != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: taiki-e/install-action@a3324fb0eb94b8230ec968c3389c1b7929fc2f3b # v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/signing_key.priv"

      - name: Build, sign, and upload plugins
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ALL_PLUGINS: ${{ needs.test.outputs.plugins }}
          TAG_GAME_ID: ${{ needs.environment.outputs.game_id }}
          R2_BUCKET: ${{ needs.environment.outputs.r2_bucket }}
          VERSION: ${{ needs.environment.outputs.version }}
        run: |
          # Production: deploy only the tagged game. Staging: deploy all.
          if [ -n "$TAG_GAME_ID" ]; then
            deploy_plugins="$TAG_GAME_ID"
          else
            deploy_plugins="$ALL_PLUGINS"
          fi

          for game_id in $deploy_plugins; do
            echo "==> Processing plugin: ${game_id} v${VERSION}"
            pids=()

            # Generate the client-only descriptor.
            just build-plugin "$game_id"
            go run ./cmd/plugin-registry/ --version "$VERSION" "plugins/${game_id}"

            # Detect plugin source types from plugin.toml (sources is an array)
            plugin_sources=$(grep '^sources *=' "plugins/${game_id}/plugin.toml" | sed 's/.*\[//;s/\].*//;s/"//g;s/,/ /g')

            # Upload icon if present (background)
            for icon_ext in png svg; do
              icon_file="plugins/${game_id}/icon.${icon_ext}"
              if [ -f "$icon_file" ]; then
                wrangler r2 object put "${R2_BUCKET}/plugins/${game_id}/icon.${icon_ext}" --file "$icon_file" --remote &
                pids+=($!)
              fi
            done

            # WASM plugins: sign and upload parser.wasm
            if echo "$plugin_sources" | grep -qw "wasm"; then
              parser_file="plugins/${game_id}/parser.wasm"
              go run ./cmd/savecraft-sign/ "$parser_file" "${RUNNER_TEMP}/signing_key.priv"
              wrangler r2 object put "${R2_BUCKET}/plugins/${game_id}/parser.wasm" --file "$parser_file" --remote &
              pids+=($!)
              wrangler r2 object put "${R2_BUCKET}/plugins/${game_id}/parser.wasm.sig" --file "${parser_file}.sig" --remote &
              pids+=($!)
            fi

            # Upload the client descriptor + detached signature over its literal bytes.
            client_manifest="plugins/${game_id}/client-manifest.json"
            go run ./cmd/savecraft-sign/ "$client_manifest" "${RUNNER_TEMP}/signing_key.priv"
            wrangler r2 object put "${R2_BUCKET}/plugins/${game_id}/client-manifest.json" --file "$client_manifest" --remote &
            pids+=($!)
            wrangler r2 object put "${R2_BUCKET}/plugins/${game_id}/client-manifest.json.sig" --file "${client_manifest}.sig" --remote &
            pids+=($!)

            # Wait for all R2 uploads to finish
            for pid in "${pids[@]}"; do wait "$pid" || exit 1; done
            echo "    Published ${game_id} v${VERSION}"
          done

      - name: Clean up signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/signing_key.priv"

  aggregate:
    name: Build signed aggregate
    permissions:
      contents: read
    needs: [environment, deploy, test]
    if: always() && needs.environment.result == 'success' && (needs.deploy.result == 'success' || (needs.deploy.result == 'skipped' && github.event_name == 'workflow_dispatch' && inputs.rebuild_only))
    runs-on: ubuntu-latest
    concurrency:
      group: plugin-aggregate-${{ needs.environment.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install wrangler
        run: npm install -g wrangler@4.95.0

      - name: Decode signing key
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_PRIVATE_KEY }}
        run: echo "$SIGNING_KEY" | base64 -d > "${RUNNER_TEMP}/signing_key.priv"

      - name: Build and publish aggregate manifest
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          MODE: publish
          SERVER_URL: ${{ needs.environment.outputs.server_url }}
          R2_BUCKET: ${{ needs.environment.outputs.r2_bucket }}
          PLUGINS_DIR: plugins
          DEPLOYED_PLUGIN: ${{ needs.environment.outputs.game_id }}
          ALLOW_REMOVE: ${{ inputs.allow_remove }}
          SIGNING_KEY_PATH: ${{ runner.temp }}/signing_key.priv
        run: scripts/build-plugin-aggregate.sh

      - name: Clean up signing key
        if: always()
        run: rm -f "${RUNNER_TEMP}/signing_key.priv"

      - name: Notify Discord (deploy)
        if: success() && needs.deploy.result == 'success'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_DEPLOY_WEBHOOK }}
          ALL_PLUGINS: ${{ needs.test.outputs.plugins }}
          TAG_GAME_ID: ${{ needs.environment.outputs.game_id }}
          IS_PROD: ${{ needs.environment.outputs.is_production }}
          VERSION: ${{ needs.environment.outputs.version }}
        run: |
          env_label="staging"
          if [ "$IS_PROD" = "true" ]; then env_label="production"; fi
          if [ -n "$TAG_GAME_ID" ]; then
            deploy_plugins="$TAG_GAME_ID"
          else
            deploy_plugins="$ALL_PLUGINS"
          fi
          for game_id in $deploy_plugins; do
            jq -n \
              --arg gid "$game_id" \
              --arg ver "$VERSION" \
              --arg env "$env_label" \
              '{embeds: [{title: ("Plugin " + $gid + " v" + $ver + " deployed to " + $env), color: 3447003}]}' \
              | curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d @-
          done

  release:
    name: Release plugin
    needs: [environment, aggregate]
    if: needs.environment.outputs.is_production == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find previous plugin tag
        id: prev
        env:
          TAG_GAME_ID: ${{ needs.environment.outputs.game_id }}
        run: |
          prev_tag=$(git tag -l "plugin-${TAG_GAME_ID}-v*" --sort=-v:refname | sed -n '2p')
          echo "tag=${prev_tag}" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PREV_TAG: ${{ steps.prev.outputs.tag }}
        run: |
          if view_output=$(gh release view "$TAG" 2>&1); then
            echo "release exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -qi 'release not found' <<<"$view_output"; then
            echo "$view_output" >&2
            exit 1
          fi
          notes_args=()
          if [ -n "$PREV_TAG" ]; then
            notes_args=(--notes-start-tag "$PREV_TAG")
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            "${notes_args[@]}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Notify Discord (release)
        if: steps.release.outputs.created == 'true'
        continue-on-error: true
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_CHANGELOG_WEBHOOK }}
          TAG_GAME_ID: ${{ needs.environment.outputs.game_id }}
          VERSION: ${{ needs.environment.outputs.version }}
        run: |
          jq -n \
            --arg gid "$TAG_GAME_ID" \
            --arg ver "$VERSION" \
            '{embeds: [{title: ("Plugin " + $gid + " v" + $ver + " released"), description: ("The " + $gid + " plugin has been updated to v" + $ver + "."), color: 5793266}]}' \
            | curl -s -X POST "$WEBHOOK_URL" -H "Content-Type: application/json" -d @-
