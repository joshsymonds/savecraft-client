name: Check Rust

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@a3324fb0eb94b8230ec968c3389c1b7929fc2f3b # v2
        with:
          tool: just

      - uses: dtolnay/rust-toolchain@stable

      # rust-toolchain.toml pins the channel, so rustup redirects every cargo call to
      # that toolchain regardless of which one the action installed. Components asked
      # of the action land on stable and are invisible to the pinned toolchain, which
      # rustup then auto-installs bare. Add them to whichever toolchain is ACTIVE, so
      # the pin stays the single source of truth for the version.
      - name: Add clippy and rustfmt to the pinned toolchain
        run: |
          rustup show active-toolchain
          rustup component add clippy rustfmt
          cargo fmt --version
          cargo clippy --version

      - name: Test Rust workspace
        run: just test-rust

      - name: Lint Rust workspace
        run: just lint-rust
